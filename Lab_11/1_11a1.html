<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 90vh;
            width: 90vw;
        }

        .box1{
            height: 400px;
            width: 600px;
            background: linear-gradient(red 40%,orange,yellow);
            display: inline-block;
            margin: 20px;
        }
        .box2{
            height: 400px;
            width: 600px;
            background: radial-gradient(red,yellow,#178f01);
            display: inline-block;
            margin: 20px;
            margin-left: 24px;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="box1"></div>
        <div class="box2"></div>
    </div>
</body>
</html>
