<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>

    <div class="container" style="width: 500px; text-align: center;">


        <h1>Student Registration</h1>
        <form action="">

            <table style="border-radius: 20px; background-color: lightgray;">

                <tr>
                    <div class="mb-3">
                        <td> <label for="exampleInputEmail1" class="form-label">FullName :</label> </td>
                        <td> <input type="text" class="form-control" id="exampleInputEmail1"
                                aria-describedby="emailHelp"></td>
                    </div>
                </tr>

                <tr>
                    <td>
                        <br>
                    </td>
                </tr>

                <tr>
                    <div class="mb-3">
                        <td> <label for="exampleInputEmail2" class="form-label">Email address :</label> </td>
                        <td> <input type="email" class="form-control" id="exampleInputEmail2"
                                aria-describedby="emailHelp"> </td>
                    </div>
                </tr>

                <tr>
                    <td>
                        <br>
                    </td>
                </tr>

                <tr>
                    <div class="mb-3">
                        <td> <label for="exampleInputEmail3" class="form-label">Mobile No :</label> </td>
                        <td><input type="tel" class="form-control" id="exampleInputEmail3" aria-describedby="emailHelp">
                        </td>
                    </div>
                </tr>

                <tr>
                    <td>
                        <br>
                    </td>
                </tr>


                <tr>
                    <div class="mb-3">
                        <td><label for="exampleFormControlTextarea1" class="form-label">Address</label> </td>
                        <td><textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea> </td>
                    </div>
                </tr>

                <tr>
                    <td>
                        <br>
                    </td>
                </tr>

                <tr>
                    <div class="mb-3">
                        <td><label for="exampleInputEmail4" class="form-label">Nationality :</label> </td>
                        <td><input type="text" class="form-control" id="exampleInputEmail4"
                                aria-describedby="emailHelp"> </td>
                    </div>
                </tr>

                <tr>
                    <td>
                        <br>
                    </td>
                </tr>

                <tr>
                    <div class="mb-3">
                        <td><label for="exampleInputEmail5" class="form-label">Date Of Birth :</label> </td>
                        <td><input type="date" class="form-control" id="exampleInputEmail5"
                                aria-describedby="emailHelp"> </td>
                    </div>
                </tr>

                <tr>
                    <td>
                        <br>
                    </td>
                </tr>


                <tr>
                    <div class="mb-3">
                        <td> <label for="" class="form-label">Gender :</label> </td>
                        <td>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1"
                                    value="option1">
                                <label class="form-check-label" for="inlineRadio1">Male</label>
                            </div>
                        </td>
                        <td>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2"
                                    value="option2">
                                <label class="form-check-label" for="inlineRadio2">Female</label>
                            </div>
                        </td>
                    </div>
                </tr>

                <tr>
                    <td>
                        <br>
                    </td>
                </tr>

                <tr>
                    <div class="mb-3">

                        <td> <label for="">Highest Degree :</label></td>
                        <td><select class="form-select" aria-label="Default select example">
                                <option selected>Select Degree</option>
                                <option value="1">One</option>
                                <option value="2">Two</option>
                                <option value="3">Three</option>
                            </select> </td>
                    </div>
                </tr>

                <tr>
                    <td>
                        <br>
                    </td>
                </tr>

                <tr>
                    <div class="mb-3">
                        <td><label for="exampleInputcpi" class="form-label">CPI :</label> </td>
                        <td><input type="text" class="form-control" id="exampleInputcpi" aria-describedby="emailHelp">
                        </td>
                    </div>
                </tr>

                <tr>
                    <td>
                        <br>
                    </td>
                </tr>

                <tr>
                    <div class="mb-3">
                        <td><label for="uni" class="form-label">University :</label> </td>
                        <td><input type="text" class="form-control" id="uni" aria-describedby="emailHelp"> </td>
                    </div>
                </tr>

                <tr>
                    <td>
                        <br>
                    </td>
                </tr>

                <tr>
                    <div class="mb-3">
                        <td><label for="">Passing Year :</label> </td>
                        <td><select class="form-select" aria-label="Default select example">
                                <option selected>Select Your Passing Year</option>
                                <option value="1">One</option>
                                <option value="2">Two</option>
                                <option value="3">Three</option>
                            </select> </td>
                    </div>
                </tr>


                <tr>
                    <td>
                        <br>
                    </td>
                </tr>


            </table>
            <input type="submit">
            <input type="reset">
        </form>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    </div>
</body>

</html>
