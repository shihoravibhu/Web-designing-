<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Layout</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

    <!-- Header -->
    <div class="container-fluid bg-light p-3">
        <div class="row">
            <div class="col-md-4 border border-primary p-3">Menu 1</div>
            <div class="col-md-4 border border-success p-3 text-center">LOGO</div>
            <div class="col-md-4 border border-danger p-3 text-end">Menu 2</div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container mt-3">
        <div class="row">
            <div class="col-md-4 border border-primary p-5">SB</div>
            <div class="col-md-8">
                <div class="row">
                    <div class="col-md-6 border border-warning text-center p-3">Image Here</div>
                    <div class="col-md-6 border border-info text-center p-3">Text Here</div>
                </div>
                <div class="row mt-3">
                    <div class="col-md-6 border border-secondary text-center p-3">Text Here</div>
                    <div class="col-md-6 border border-dark text-center p-3">Image Here</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="container-fluid bg-dark text-white text-center p-3 mt-3">
        © DARSHAN
    </div>

</body>
</html>
