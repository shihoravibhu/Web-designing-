<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Layout with Spacing Fix</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

    <!-- Header -->
    <div class="container-fluid bg-light p-3">
        <div class="row text-center g-3">
            <div class="col-md-6 border border-primary">Logo</div>
            <div class="col-md-6 border border-success">Menu</div>
        </div>
    </div>

    <!-- Image Slider Placeholder -->
    <div class="container-fluid text-center border border-danger p-5 mt-3">
        IMAGE SLIDER HERE
    </div>

    <!-- Main Content -->
    <div class="container mt-3 border border-dark p-3 m-2">
        <div class="row g-3">
            <div class="col-md-2 border border-warning text-center p-3">DIV 1</div>
            <div class="col-md-8 border border-info text-center p-3">DIV 2</div>
            <div class="col-md-2 border border-secondary text-center p-3">DIV 3</div>
        </div>
    </div>

    <!-- Additional Section -->
    <div class="container mt-3 border border-dark m-2">
        <div class="row g-3 p-2">
            <div class="col-md border border-primary p-4">
                <div class="row g-3 border border-success p-3">
                    <div class="col-md border border-dark text-center p-2">DIV 4</div>
                    <div class="col-md border border-success text-center p-2">DIV 5</div>
                </div>
            </div>
            <div class="col-md border border-primary text-center p-2">DIV 6</div>
        </div>
    </div>

    <!-- Footer -->
    <div class="container-fluid bg-dark text-white text-center p-3 mt-3">
        © DARSHAN
    </div>

</body>
</html>
