<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

.btn {
    position: relative;
    background-color: transparent;
    transition: 0.5s ease;  
    color: blueviolet;
    border: 2px solid blueviolet;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    overflow: hidden;
    z-index: 1;
}

.btn::before {
    content: '';  
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 0%;  
    background-color: #00ff37;
    transition: all 0.3s ease;
    z-index: -1;
}

.btn:hover::before {
    width: 100%; 
}

.btn:hover {
    color: white;
}


    </style>
</head>
<body>
    <button class="btn">hover</button>
</body>
</html>
