<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 50vh;
            width: 50vw;
            margin: 20px;
            animation: color 2s ease-out 0s 10 ;
            animation-fill-mode: backwards;
        }
        @keyframes color {
            from{
                background-color: red;
            }
            to{
                background-color: yellow;
            }
            
        }

    </style>
</head>
<body>
    <div></div>
</body>
</html>
